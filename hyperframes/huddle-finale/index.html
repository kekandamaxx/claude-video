<!doctype html>
<!--
  HuddleEdit finale: "BOLEH MENANG" payoff (closes the hook's open loop), then the end card
  on the freeze frame of the team shout. Transparent WebM, laid over the footage by Remotion.
  Times (seconds from this overlay's start) are variables filled from src/edits/huddle/edl.ts.
  Layout: low band only, y 900-1420 (faces in clip3/clip4 and on the freeze frame end at y ~840).
-->
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"tBoleh","type":"number","label":"Boleh (s)","default":0.07},
    {"id":"tMenang","type":"number","label":"menang (s)","default":0.3},
    {"id":"tCheer","type":"number","label":"cheer cut (s)","default":0.53},
    {"id":"tFreeze","type":"number","label":"freeze / shout (s)","default":3.07},
    {"id":"tEnd","type":"number","label":"end (s)","default":5.73}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Anton'; src: url('assets/fonts/anton.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'MontserratBlack'; src: url('assets/fonts/montserrat-900.woff2') format('woff2'); font-weight: 900; }
      :root { --gold: #ffc72c; --gold-deep: #f2a900; --navy: #0a1633; --red: #ff2d3d; --green: #2be38b; --white: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: absolute; inset: 0; font-family: 'Anton', sans-serif; color: var(--white); }
      .layer { position: absolute; inset: 0; }
      .w { display: inline-block; text-transform: uppercase; line-height: 0.95; text-shadow: 0 6px 0 var(--navy), 0 14px 30px rgba(0,0,0,0.5); }
      .scrim { position: absolute; left: 0; right: 0; top: 860px; height: 600px;
        background: linear-gradient(180deg, rgba(10,22,51,0) 0%, rgba(10,22,51,0.6) 30%, rgba(10,22,51,0.72) 78%, rgba(10,22,51,0) 100%); }

      /* ---- payoff ---- */
      #fn-boleh { position: absolute; left: 0; width: 1080px; top: 985px; display: flex; justify-content: center; }
      #fn-boleh .w { font-size: 110px; }
      #fn-flip { position: absolute; left: 160px; width: 760px; top: 1110px; height: 230px; perspective: 900px; }
      .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 26px; backface-visibility: hidden; }
      #fn-minus { background: var(--navy); border: 6px solid var(--red); }
      #fn-minus span { font-size: 176px; color: var(--red); }
      #fn-win { background: linear-gradient(180deg, #ffd85a 0%, var(--gold) 55%, var(--gold-deep) 100%); border: 6px solid var(--navy);
        box-shadow: 0 0 0 6px rgba(10,22,51,0.55), 0 22px 50px rgba(0,0,0,0.5), 0 0 90px rgba(255,199,44,0.55); }
      #fn-win span { font-size: 166px; color: var(--navy); text-shadow: none; letter-spacing: 2px; }
      #fn-rays { position: absolute; left: 540px; top: 1225px; width: 0; height: 0; }
      .ray { position: absolute; left: -6px; top: -300px; width: 12px; height: 150px; border-radius: 6px; background: var(--gold); transform-origin: 6px 300px; opacity: 0; }
      .spark { position: absolute; width: 16px; height: 16px; border-radius: 4px; opacity: 0; }

      /* ---- end card ---- */
      #fn-card { position: absolute; left: 0; width: 1080px; top: 930px; height: 500px; }
      #fn-streaks { position: absolute; inset: 0; overflow: hidden; }
      .streak { position: absolute; height: 10px; border-radius: 5px; background: linear-gradient(90deg, rgba(255,199,44,0), rgba(255,199,44,0.95)); opacity: 0; }
      #fn-umpsa { position: absolute; left: 0; width: 1080px; top: 30px; display: flex; justify-content: center; gap: 6px; }
      #fn-umpsa .w { font-size: 230px; color: var(--gold); }
      #fn-rule { position: absolute; left: 200px; top: 290px; width: 680px; height: 8px; border-radius: 4px; background: var(--gold); transform-origin: 50% 50%; box-shadow: 0 4px 0 var(--navy); }
      #fn-hb { position: absolute; left: 0; width: 1080px; top: 316px; text-align: center; font-family: 'MontserratBlack', sans-serif; font-size: 50px; letter-spacing: 22px; text-indent: 22px; text-shadow: 0 5px 0 var(--navy), 0 12px 26px rgba(0,0,0,0.5); }
      #fn-tag { position: absolute; left: 0; width: 1080px; top: 400px; display: flex; justify-content: center; }
      .pill { display: inline-flex; align-items: center; gap: 14px; padding: 12px 26px; border-radius: 999px; background: rgba(10,22,51,0.92);
        font-family: 'MontserratBlack', sans-serif; font-size: 30px; letter-spacing: 4px; text-transform: uppercase; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
      .pill b { color: var(--gold); font-weight: 900; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.74" data-width="1080" data-height="1920">
      <div id="fn-payoff" class="clip layer" data-start="0" data-duration="2.2" data-track-index="0" data-layout-allow-overlap data-layout-allow-overflow>
        <div class="scrim" id="fn-scrim1"></div>
        <div id="fn-rays"></div>
        <div id="fn-boleh"><span class="w" id="fn-boleh-w">Boleh</span></div>
        <div id="fn-flip">
          <div id="fn-flipper" style="position:absolute; inset:0; transform-style: preserve-3d;">
            <div class="face" id="fn-minus"><span class="w">-3</span></div>
            <div class="face" id="fn-win" style="transform: rotateX(180deg)"><span class="w">MENANG</span></div>
          </div>
        </div>
      </div>
      <div id="fn-end" class="clip layer" data-start="2.9" data-duration="2.84" data-track-index="1" data-layout-allow-overlap data-layout-allow-overflow>
        <div class="scrim" id="fn-scrim2"></div>
        <div id="fn-card">
          <div id="fn-streaks"></div>
          <div id="fn-umpsa"><span class="w fl">U</span><span class="w fl">M</span><span class="w fl">P</span><span class="w fl">S</span><span class="w fl">A</span></div>
          <div id="fn-rule"></div>
          <div id="fn-hb">HANDBALL</div>
          <div id="fn-tag"><div class="pill" id="fn-pill">Pre-match huddle · <b>Boleh menang</b></div></div>
        </div>
      </div>
    </div>
    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const T = Object.assign({tBoleh: 0.07, tMenang: 0.3, tCheer: 0.53, tFreeze: 3.07, tEnd: 5.73}, v);
      // Seeded generator: same sparks/streaks on every render.
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      // Build static decoration nodes once (deterministic, not timed elements).
      const rays = document.getElementById('fn-rays');
      for (let i = 0; i < 14; i++) {
        const r = document.createElement('div'); r.className = 'ray'; r.id = 'fn-ray' + i;
        rays.appendChild(r); gsap.set(r, { rotation: -80 + i * (160 / 13) });
      }
      for (let i = 0; i < 22; i++) {
        const s = document.createElement('div'); s.className = 'spark'; s.id = 'fn-spark' + i;
        s.style.background = i % 3 === 0 ? '#ffffff' : i % 3 === 1 ? '#ffc72c' : '#2be38b';
        s.style.left = '540px'; s.style.top = '1225px'; rays.parentNode.appendChild(s);
      }
      const streaks = document.getElementById('fn-streaks');
      for (let i = 0; i < 9; i++) {
        const s = document.createElement('div'); s.className = 'streak'; s.id = 'fn-streak' + i;
        s.style.top = (40 + rnd() * 400) + 'px'; s.style.width = (220 + rnd() * 360) + 'px'; s.style.left = '-600px'; streaks.appendChild(s);
      }

      const tl = gsap.timeline({ paused: true });
      // ---------------- payoff: the -3 from the hook comes back, flips to MENANG
      tl.fromTo('#fn-scrim1', { opacity: 0 }, { opacity: 1, duration: 0.12, ease: 'power2.out' }, 0);
      tl.fromTo('#fn-flip', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.14, ease: 'expo.out' }, 0);
      tl.fromTo('#fn-boleh-w', { opacity: 0, y: 40, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.16, ease: 'expo.out' }, T.tBoleh);
      tl.fromTo('#fn-flipper', { rotationX: 0 }, { rotationX: 180, duration: 0.34, ease: 'back.out(1.5)' }, T.tMenang - 0.06);
      tl.set('#fn-minus', { opacity: 0 }, T.tMenang + 0.04);
      tl.fromTo('#fn-flip', { scale: 1 }, { keyframes: [{ scale: 1.12, duration: 0.1 }, { scale: 1, duration: 0.22, ease: 'power2.out' }] }, T.tMenang + 0.1);
      for (let i = 0; i < 14; i++) {
        tl.fromTo('#fn-ray' + i, { opacity: 0, scaleY: 0.2 }, { opacity: 0.9, scaleY: 1, duration: 0.16, ease: 'expo.out' }, T.tMenang + 0.12 + (i % 4) * 0.015);
        tl.to('#fn-ray' + i, { opacity: 0, duration: 0.4, ease: 'power2.in' }, T.tMenang + 0.45);
      }
      for (let i = 0; i < 22; i++) {
        const a = (-35 + rnd() * 250) * Math.PI / 180, d = 220 + rnd() * 260;
        const t0 = T.tMenang + 0.12, dur = 0.9 + rnd() * 0.4;
        // Opacity is its own pair of tweens so the sparks stay hidden before the burst on any seek.
        tl.fromTo('#fn-spark' + i, { opacity: 0 }, { opacity: 1, duration: 0.02 }, t0);
        tl.fromTo('#fn-spark' + i, { x: 0, y: 0, rotation: 0, scale: 1 },
          { x: Math.cos(a) * d * 1.3, y: Math.sin(a) * d * 0.45 + 60, rotation: rnd() * 540, scale: 0.6, duration: dur, ease: 'power3.out' }, t0);
        tl.to('#fn-spark' + i, { opacity: 0, duration: dur * 0.6, ease: 'power2.in' }, t0 + dur * 0.4);
      }
      // Clears before the hands go in, so the moment plays clean.
      tl.to(['#fn-boleh', '#fn-flip'], { opacity: 0, y: 60, filter: 'blur(12px)', duration: 0.22, ease: 'power3.in', stagger: 0.04 }, 1.75);
      tl.to('#fn-scrim1', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 1.8);

      // ---------------- end card on the freeze frame
      const F = T.tFreeze;
      tl.fromTo('#fn-scrim2', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power2.out' }, F);
      for (let i = 0; i < 9; i++) {
        tl.fromTo('#fn-streak' + i, { opacity: 0, x: 0 }, { opacity: 0.9, x: 1900, duration: 0.42, ease: 'power3.out' }, F + i * 0.025);
      }
      tl.fromTo('#fn-umpsa .fl', { opacity: 0, y: 120, scale: 1.4, filter: 'blur(10px)' }, { opacity: 1, y: 0, scale: 1, filter: 'blur(0px)', duration: 0.28, ease: 'expo.out', stagger: 0.035 }, F + 0.02);
      tl.fromTo('#fn-rule', { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: 'expo.out' }, F + 0.22);
      tl.fromTo('#fn-hb', { opacity: 0, scaleX: 1.5, filter: 'blur(8px)' }, { opacity: 1, scaleX: 1, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' }, F + 0.26);
      tl.fromTo('#fn-pill', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: 'expo.out' }, F + 0.5);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
