<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared.css" />
    <style>
      #zone { position: absolute; left: 70px; top: 260px; width: 880px; height: 240px; }
      #pill { position: absolute; left: 0; top: 0; width: 880px; display: flex; justify-content: center; }
      #pill-in { display: inline-flex; align-items: center; gap: 12px; padding: 9px 22px; border-radius: 999px; background: rgba(10,22,51,0.9); color: var(--white); font-size: 28px; letter-spacing: 3px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
      #dot { width: 14px; height: 14px; border-radius: 7px; background: var(--red); box-shadow: 0 0 12px var(--red); }
      #board { position: absolute; left: 110px; top: 62px; width: 660px; height: 172px; }
      #plate { position: absolute; inset: 0; border-radius: 26px; background: linear-gradient(180deg, rgba(10,22,51,0.96), rgba(6,12,32,0.92)); border: 4px solid var(--red); box-shadow: 0 14px 40px rgba(0,0,0,0.5); }
      #num { position: absolute; left: 28px; top: 10px; width: 250px; height: 152px; display: flex; align-items: center; justify-content: center; font-size: 150px; color: var(--red); text-shadow: 0 0 28px rgba(255,45,61,0.65); }
      .n { position: absolute; }
      #label { position: absolute; left: 290px; top: 26px; width: 350px; color: var(--white); }
      #l1 { font-size: 34px; letter-spacing: 4px; color: rgba(255,255,255,0.8); }
      #l2 { font-size: 78px; }
      #slam { position: absolute; left: 0; top: 48px; width: 880px; height: 176px; display: flex; align-items: center; justify-content: center; }
      #slam-in { font-size: 150px; color: var(--gold); text-shadow: 0 8px 0 var(--navy), 0 14px 34px rgba(0,0,0,0.5); white-space: nowrap; }
      #bar { position: absolute; left: 190px; top: 232px; width: 500px; height: 8px; border-radius: 4px; background: var(--gold); transform-origin: 50% 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hook" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-fps="30">
      <div id="scene" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="zone">
          <div id="pill"><div id="pill-in" class="ui"><span id="dot"></span>UMPSA Handball</div></div>
          <div id="board">
            <div id="plate"></div>
            <div id="num" class="display">
              <span class="n" id="n1">-1</span><span class="n" id="n2">-2</span><span class="n" id="n3">-3</span>
            </div>
            <div id="label">
              <div id="l1" class="ui">Kena tinggal</div>
              <div id="l2" class="display">3 biji gol</div>
            </div>
          </div>
          <div id="slam"><div id="slam-in" class="display">Jangan down</div></div>
          <div id="bar"></div>
        </div>
      </div>
    </div>
    <script>
      // Beats (seconds in the hook): "kena" 1.33, "3" 1.67, "jangan" 2.37, "down" 2.63.
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#pill-in", { opacity: 0, y: -30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.05);
      tl.fromTo("#board", { opacity: 0, y: 40, scale: 0.86 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, 0.2);
      tl.fromTo("#label", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 0.38);
      // -1, -2, -3: each number punches in and the last one lands on the spoken "3".
      tl.set(["#n1", "#n2", "#n3"], { opacity: 0 }, 0);
      [["#n1", 0.55], ["#n2", 1.1], ["#n3", 1.67]].forEach(([id, t], i, all) => {
        tl.fromTo(id, { opacity: 0, scale: 1.9 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.out" }, t);
        if (i < all.length - 1) tl.to(id, { opacity: 0, duration: 0.04 }, all[i + 1][1] - 0.04);
      });
      tl.to("#board", { x: -10, duration: 0.04, repeat: 5, yoyo: true, ease: "none" }, 1.69);
      tl.to("#plate", { scale: 1.04, duration: 0.1, repeat: 1, yoyo: true, ease: "power2.out" }, 1.67);
      // Swap to the gold answer on "jangan down".
      tl.to(["#board", "#pill-in"], { opacity: 0, scale: 0.7, duration: 0.12, ease: "power2.in" }, 2.25);
      tl.fromTo("#slam-in", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.out" }, 2.37);
      tl.fromTo("#bar", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.2, ease: "power3.out" }, 2.5);
      tl.to(["#slam-in", "#bar"], { opacity: 0, y: -24, duration: 0.1, ease: "power2.in" }, 2.88);
      window.__timelines = window.__timelines || {};
      window.__timelines["hook"] = tl;
    </script>
  </body>
</html>
